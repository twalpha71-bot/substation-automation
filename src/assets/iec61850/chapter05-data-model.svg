<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="420" viewBox="0 0 1120 420" role="img" aria-labelledby="title desc">
  <title id="title">IEC 61850 — from device to meaningful data</title>
  <desc id="desc">An IED hosts the server. Logical device FDR01LD0 contains logical node XCBR1, position data object Pos, and attributes stVal, q and t. Configured datasets and MMS reports deliver selected information to SCADA/HMI.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#03101e"/><stop offset=".55" stop-color="#082b42"/><stop offset="1" stop-color="#031526"/></linearGradient>
    <linearGradient id="panel" x2="0" y2="1"><stop stop-color="#113a52"/><stop offset="1" stop-color="#061b30"/></linearGradient>
    <linearGradient id="line"><stop stop-color="#00cfff"/><stop offset="1" stop-color="#6fffd2"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#20607c" stroke-opacity=".2"/></pattern>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="5"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#4ae8f5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1120" height="420" rx="20" fill="url(#bg)"/>
  <rect width="1120" height="420" rx="20" fill="url(#grid)"/>
  <path d="M30 28H122M30 28V58M1090 28H998M1090 28V58M30 392H122M30 392V362M1090 392H998M1090 392V362" fill="none" stroke="#23c6eb" stroke-opacity=".65"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="48" y="64" fill="#5be8ff" font-size="14" letter-spacing="3">CHAPTER 05 / INFORMATION ARCHITECTURE</text>
    <text x="48" y="102" fill="#f1faff" font-size="29" font-weight="700">One device. A structured language.</text>
    <text x="48" y="130" fill="#a8c9dc" font-size="16">Trace a breaker indication from its IED to its value, quality and time.</text>
    <path d="M95 238H1020" fill="none" stroke="#25e3fc" stroke-width="9" opacity=".3" filter="url(#glow)"/>
    <g fill="none" stroke="#4ae8f5" stroke-width="2" marker-end="url(#arrow)">
      <path d="M220 235H246"/><path d="M430 235H456"/><path d="M640 235H666"/><path d="M850 235H876"/>
    </g>
    <g fill="url(#panel)" stroke="#217b9d" stroke-width="1.5">
      <rect x="40" y="166" width="180" height="130" rx="12"/><rect x="250" y="166" width="180" height="130" rx="12"/>
      <rect x="460" y="166" width="180" height="130" rx="12"/><rect x="670" y="166" width="180" height="130" rx="12"/>
      <rect x="880" y="166" width="200" height="130" rx="12" stroke="#50d9b2"/>
    </g>
    <g font-size="13" fill="#61dff6" letter-spacing="1.3">
      <text x="56" y="192">01 / PHYSICAL IED</text><text x="266" y="192">02 / LOGICAL DEVICE</text>
      <text x="476" y="192">03 / LOGICAL NODE</text><text x="686" y="192">04 / DATA OBJECT</text><text x="896" y="192" fill="#79f4c8">05 / ATTRIBUTES</text>
    </g>
    <g fill="#f1faff" font-weight="700" font-size="27">
      <text x="56" y="237">FDR01</text><text x="266" y="237" font-size="24">FDR01LD0</text><text x="476" y="237">XCBR1</text>
      <text x="686" y="237">Pos</text><text x="896" y="237" font-size="25">stVal · q · t</text>
    </g>
    <g fill="#b6d1e1" font-size="15"><text x="56" y="269">Hosts the server</text><text x="266" y="269">Groups functions</text><text x="476" y="269">Circuit breaker</text><text x="686" y="269">Position / DPC</text><text x="896" y="269">Value · quality · time</text></g>
    <path d="M980 297V324H675" fill="none" stroke="#4ae8f5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="350" y="312" width="310" height="32" rx="7" fill="#0b3345" stroke="#226581"/>
    <text x="505" y="333" text-anchor="middle" fill="#c7f0fc" font-size="15">Configured DataSet + MMS report</text>
    <path d="M350 328H319" fill="none" stroke="#4ae8f5" stroke-width="1.5" marker-end="url(#arrow)"/>
    <rect x="116" y="312" width="190" height="32" rx="7" fill="#0c423e" stroke="#39a38d"/>
    <text x="211" y="333" text-anchor="middle" fill="#99f3d8" font-size="15" font-weight="600">SCADA / HMI</text>
    <text x="560" y="381" text-anchor="middle" font-family="Consolas, monospace" fill="#85dbea" font-size="17">FDR01LD0/XCBR1.Pos.stVal  [ST]</text>
  </g>
</svg>
